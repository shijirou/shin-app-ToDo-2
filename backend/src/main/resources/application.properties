spring.application.name=taskboard

# PostgreSQL（compose.yaml で起動するデータベース）への接続情報
spring.datasource.url=jdbc:postgresql://localhost:5432/taskboard
spring.datasource.username=postgres
spring.datasource.password=postgres
# エンティティ（Java のクラス）に合わせてテーブルを自動で作成・更新する
spring.jpa.hibernate.ddl-auto=update
# DB を読むのはサービス層の中だけにする（Spring Boot がすすめる設定。初期値の true だと起動時に警告が出る）
spring.jpa.open-in-view=false
# 実行される SQL をログに表示する
spring.jpa.show-sql=true
# 起動時に data.sql（テストデータ）を毎回実行する
spring.sql.init.mode=always
# data.sql を UTF-8（日本語が文字化けしない形式）で読む
spring.sql.init.encoding=UTF-8
# テーブルを自動で作ったあとに data.sql を実行する
spring.jpa.defer-datasource-initialization=true
