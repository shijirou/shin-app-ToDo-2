# PostgreSQL（データベース）を Docker コンテナで動かすための設定
# 起動: docker compose up -d   停止: docker compose down
services:
  db:
    image: postgres:18
    container_name: taskboard-db
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 127.0.0.1 を付けて、このパソコンからだけ接続できるようにする（同じ Wi-Fi のほかのパソコンからは接続できない）
      - "127.0.0.1:5432:5432"
    volumes:
      - taskboard-db-data:/var/lib/postgresql

volumes:
  taskboard-db-data:
